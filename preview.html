<script type="text/x-dc" data-dc-script data-props="{&quot;syncScroll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;보기 설정&quot;},&quot;frameRatio&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2,&quot;min&quot;:1.4,&quot;max&quot;:2.6,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;보기 설정&quot;}}">
// ── 투표 ───────────────────────────────────────────────────
// 집계·마감·1인 1표 판정은 전부 서버(src/worker.js)가 한다.
// 마감 시각을 바꾸려면 src/worker.js 의 VOTE_DEADLINE 을 고칠 것.
// 개인 링크로 배포할 경우 주소에 ?r=<토큰> 을 붙이면 그 토큰이 투표자 식별자가 된다.

const api = (path) => {
  const r = new URLSearchParams(location.search).get('r');
  return r ? path + (path.includes('?') ? '&' : '?') + 'r=' + encodeURIComponent(r) : path;
};

const fmtDeadline = (iso) => {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleString('ko-KR', {
      timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false
    });
  } catch (e) { return iso; }
};

class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      sync: p.syncScroll ?? false,
      votes: { A: 0, B: 0, C: 0, D: 0, E: 0 },
      myVote: null,
      pending: null,
      closed: false,
      deadline: null,
      voteEnabled: false,
      loaded: false,
      busy: false,
      err: null
    };
    this.onScroll = this.onScroll.bind(this);
    this.toggleSync = this.toggleSync.bind(this);
    this.onVote = this.onVote.bind(this);
    this.openVideo1 = this.openVideo1.bind(this);
    this.openVideo2 = this.openVideo2.bind(this);
  }
  componentDidMount() {
    this.refresh();
  }
  componentWillUnmount() {
    if (this._closeTimer) clearTimeout(this._closeTimer);
  }
  applyState(d) {
    this.setState({
      votes: d.votes,
      myVote: d.myVote,
      closed: d.closed,
      deadline: d.deadline,
      voteEnabled: !!d.voteEnabled,
      loaded: true,
      busy: false
    });
    if (this._closeTimer) clearTimeout(this._closeTimer);
    if (d.deadline && !d.closed) {
      const left = Date.parse(d.deadline) - Date.now();
      if (left > 0 && left < 2147483647) {
        this._closeTimer = setTimeout(() => this.refresh(), left);
      }
    }
  }
  async refresh() {
    try {
      const r = await fetch(api('/api/state'), { headers: { accept: 'application/json' } });
      if (!r.ok) throw new Error('state ' + r.status);
      const d = await r.json();
      this.applyState(d);
      this.setState({ err: null });
      return d;
    } catch (e) {
      this.setState({ loaded: true, busy: false, err: '집계를 불러오지 못했습니다' });
      return null;
    }
  }
  // 1클릭 = 선택(pending), 2클릭 = 확정(submit).
  // 확정하면 서버가 1인 1표로 잠가 되돌릴 수 없으므로, 그 전에 되돌릴 수 있는 지점을 한 번 둔다.
  onVote(id) {
    const s = this.state;
    if (!s.voteEnabled || !s.loaded || s.busy || s.closed || s.myVote) return;
    if (s.pending !== id) {
      this._pendingAt = Date.now();
      this.setState({ pending: id, err: null });
      return;
    }
    // 더블클릭이 선택·확정을 한 번에 통과하지 못하게 한다.
    if (Date.now() - (this._pendingAt || 0) < 400) return;
    this.submit(id);
  }
  async submit(id) {
    this.setState({ busy: true, err: null });
    try {
      const r = await fetch(api('/api/vote'), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ choice: id })
      });
      const d = await r.json().catch(() => null);
      if (!d || !d.votes) throw new Error('vote ' + r.status);
      this.applyState(d);
      this.settle(d.myVote, id);
    } catch (e) {
      // 응답만 유실되고 서버에는 저장됐을 수 있다.
      // 여기서 끊으면 "실패한 줄 알고 다시 눌렀는데 첫 선택이 확정돼 있는" 상태가 된다 →
      // 서버 상태를 다시 읽어 실제로 접수됐는지 판정한다.
      const d = await this.refresh();
      if (d) this.settle(d.myVote, id);
      else this.setState({ busy: false, pending: id, err: '투표 전송 결과를 확인하지 못했습니다. 잠시 후 다시 시도해 주세요' });
    }
  }
  // 접수 판정은 클라이언트 낙관값이 아니라 서버가 실제로 기록한 myVote 로만 한다.
  settle(serverVote, id) {
    if (serverVote === id) {
      this.setState({ busy: false, pending: null, err: null });
    } else if (serverVote) {
      this.setState({ busy: false, pending: null, err: serverVote + '안으로 이미 투표되어 있습니다. 변경할 수 없습니다' });
    } else if (this.state.closed) {
      this.setState({ busy: false, pending: null, err: null });
    } else {
      this.setState({ busy: false, pending: id, err: '투표가 접수되지 않았습니다. 다시 확정해 주세요' });
    }
  }
  toggleSync() { this.setState(s => ({ sync: !s.sync })); }
  openVideo1() {
    window.openYouTubeVideo('영상 1', 'https://www.youtube.com/embed/rCEY9Eyd48g?playsinline=1&rel=0');
  }
  openVideo2() {
    window.openYouTubeVideo('영상 2', 'https://www.youtube.com/embed/9oTGDF0UScU?playsinline=1&rel=0');
  }
  onScroll(e) {
    if (!this.state.sync || this._lock) return;
    const el = e.currentTarget;
    const range = el.scrollHeight - el.clientHeight;
    if (range <= 0) return;
    const ratio = el.scrollTop / range;
    this._lock = true;
    document.querySelectorAll('[data-scan-scroll]').forEach(o => {
      if (o !== el) o.scrollTop = ratio * (o.scrollHeight - o.clientHeight);
    });
    requestAnimationFrame(() => { this._lock = false; });
  }
  voteInfo(id) {
    const s = this.state;
    const selected = s.voteEnabled && s.myVote === id;           // 서버에 기록된 확정표
    const pending = !s.myVote && !s.closed && s.pending === id;  // 확정 전 선택
    const locked = !s.voteEnabled || !s.loaded || s.busy || s.closed || !!s.myVote;
    const count = s.votes[id] || 0;
    return {
      ring: selected ? '2px solid #1B4CD8' : (pending ? '2px dashed #1B4CD8' : '1px solid #E4E1D9'),
      shadow: selected || pending
        ? '0 1px 2px rgba(24,22,18,.04), 0 16px 32px -16px rgba(27,76,216,.38)'
        : '0 1px 2px rgba(24,22,18,.04), 0 12px 28px -18px rgba(24,22,18,.22)',
      btnBg: selected ? (s.closed ? '#93A9DF' : '#1B4CD8') : (locked ? '#EFEEEA' : '#fff'),
      btnFg: selected ? '#fff' : (locked ? '#B0AC9F' : (pending ? '#1B4CD8' : '#1A1A18')),
      btnBorder: selected ? (s.closed ? '#93A9DF' : '#1B4CD8') : (locked ? '#E4E1D9' : (pending ? '#1B4CD8' : '#DDDAD2')),
      btnLabel: selected
        ? '✓ 투표완료'
        : (s.closed ? '투표 마감' : (pending ? (s.busy ? '전송 중…' : id + '안으로 확정하기') : '투표하기')),
      btnCursor: !s.loaded ? 'default' : (s.busy ? 'wait' : (locked ? 'not-allowed' : 'pointer')),
      disabled: locked,
      countLabel: s.voteEnabled ? count + '표' : ''
    };
  }
  note() {
    const s = this.state;
    if (!s.voteEnabled) return ['#B0AC9F', ''];
    if (s.err) return ['#C0392B', s.err];
    if (!s.loaded) return ['#B0AC9F', '집계 불러오는 중…'];
    if (s.busy) return ['#1B4CD8', '투표 접수 중… 창을 닫지 마세요'];
    const when = s.deadline ? fmtDeadline(s.deadline) : '';
    if (s.closed) return ['#C0392B', '투표가 마감되었습니다' + (when ? ' (' + when + ')' : '')];
    if (s.myVote) return ['#1B4CD8', '✓ ' + s.myVote + '안 투표 완료 · 변경할 수 없습니다' + (when ? ' · 마감 ' + when : '')];
    if (s.pending) return ['#1B4CD8', s.pending + '안 선택됨 — 버튼을 한 번 더 눌러 확정하세요 · 다른 안을 누르면 선택이 바뀝니다'];
    return ['#B0AC9F', (when ? '투표 마감 ' + when + ' · ' : '') + '1인 1표, 확정 후 변경 불가'];
  }
  renderVals() {
    const sync = this.state.sync;
    const ids = ['A', 'B', 'C', 'D', 'E'];
    const totalVotes = ids.reduce((sum, id) => sum + (this.state.votes[id] || 0), 0);
    const [noteColor, noteText] = this.note();
    const out = {
      onScroll: this.onScroll,
      toggleSync: this.toggleSync,
      openVideo1: this.openVideo1,
      openVideo2: this.openVideo2,
      syncTrack: sync ? '#1A1A18' : '#D3CFC6',
      syncKnob: sync ? 'translateX(16px)' : 'translateX(0)',
      frameAspect: '1 / ' + (this.props.frameRatio ?? 2),
      totalVotes,
      voteBtnDisplay: this.state.voteEnabled ? 'flex' : 'none',
      voteTextDisplay: this.state.voteEnabled ? 'inline' : 'none',
      deadlineLabel: noteText,
      deadlineColor: noteColor
    };
    ids.forEach(id => {
      out['state' + id] = this.voteInfo(id);
      out['vote' + id] = () => this.onVote(id);
    });
    return out;
  }
}

</script>

<!-- 영상 모달 -->
<style>
  #videoModal::backdrop { background: rgba(0,0,0,.72); }
  @media (max-width: 600px) {
    #videoModal {
      width: 100vw !important;
      max-width: none !important;
      height: 100dvh !important;
      max-height: none !important;
      margin: 0 !important;
      border-radius: 0 !important;
    }
    #popupVideo, #youtubePlayer {
      height: calc(100dvh - 61px) !important;
      max-height: none !important;
    }
  }
</style>

<dialog id="videoModal"
  style="width:min(430px, calc(100vw - 32px)); padding:0; border:0; border-radius:20px; overflow:hidden; background:#111; color:#fff;">
  <div style="display:flex; align-items:center; justify-content:space-between; padding:16px 18px; background:#1A1A18;">
    <strong id="videoTitle" style="font-size:16px;font-family:pretendard;">영상 보기</strong>
    <button type="button" onclick="closeVideo()"
      style="border:0; background:transparent; color:#fff; font-size:28px; line-height:1; cursor:pointer;">
      ×
    </button>
  </div>

  <video id="popupVideo" controls playsinline
    style="display:none; width:100%; max-height:75vh; background:#000;">
  </video>

  <iframe id="youtubePlayer"
    title="영상 재생"
    style="display:none; width:100%; height:min(76vh, 760px); border:0; background:#000;"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>
</dialog>

<script>
  window.openVideo = function(title, url) {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('popupVideo');
    const youtube = document.getElementById('youtubePlayer');

    document.getElementById('videoTitle').textContent = title;
    youtube.src = '';
    youtube.style.display = 'none';
    video.style.display = 'block';
    video.src = url;
    video.load();
    modal.showModal();
    video.play().catch(() => {});
  };

  window.openYouTubeVideo = function(title, url) {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('popupVideo');
    const youtube = document.getElementById('youtubePlayer');

    document.getElementById('videoTitle').textContent = title;
    video.pause();
    video.removeAttribute('src');
    video.load();
    video.style.display = 'none';
    youtube.src = url;
    youtube.style.display = 'block';
    modal.showModal();
  };

  window.closeVideo = function() {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('popupVideo');
    const youtube = document.getElementById('youtubePlayer');

    video.pause();
    video.currentTime = 0;
    youtube.src = '';
    modal.close();
  };
</script>

</body>
</html>
